name: Probar Catastro
on:
  push:
    branches: [portales]
    paths: ['.github/workflows/probar_catastro.yml', 'src/05_distancias_calle.py', 'src/07_nuevos_sitios.py']
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Servidor de rutas a pie con el mapa de la Comunidad de Madrid
        # OSRM propio con el mapa de OpenStreetMap de Geofabrik: así no se carga el servidor público
        run: |
          mkdir -p osrm && cd osrm
          curl -sSfL -o madrid.osm.pbf https://download.geofabrik.de/europe/spain/madrid-latest.osm.pbf
          IMG=ghcr.io/project-osrm/osrm-backend:v5.27.1
          docker run --rm -v "$PWD:/data" $IMG osrm-extract -p /opt/foot.lua /data/madrid.osm.pbf
          docker run --rm -v "$PWD:/data" $IMG osrm-partition /data/madrid.osrm
          docker run --rm -v "$PWD:/data" $IMG osrm-customize /data/madrid.osrm
          docker run -d --name osrm -p 5000:5000 -v "$PWD:/data" $IMG osrm-routed --algorithm mld --max-table-size 1000 /data/madrid.osrm
          for i in $(seq 1 60); do curl -sf "http://localhost:5000/route/v1/foot/-3.70,40.42;-3.69,40.42" > /dev/null && break; sleep 2; done
          curl -s "http://localhost:5000/route/v1/foot/-3.70,40.42;-3.69,40.42?overview=false" | head -c 300

      - working-directory: src
        env:
          OSRM_URL: http://localhost:5000
        run: |
          python 01_descargar.py
          python viviendas_catastro.py
          python 02_limpiar_desfibriladores.py
          python 03_poblacion_secciones.py
          python 03b_puntos_de_poblacion.py
          python 04_cobertura.py
          python 05_distancias_calle.py
          python 06_cobertura_calle.py
          python 07_nuevos_sitios.py
          python 08_sitios_reales.py
          python 09_exportar_web.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/elaborados datos/respaldo web
          git commit -m "Datos recalculados con los puntos de población"
          git pull --rebase -X theirs
          git push
