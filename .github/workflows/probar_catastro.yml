name: Probar Catastro
on:
  push:
    branches: [portales]
    paths: ['.github/workflows/probar_catastro.yml', 'src/probar_catastro.py', 'src/viviendas_catastro.py', 'src/03b_puntos_de_poblacion.py']
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - working-directory: src
        run: |
          python viviendas_catastro.py
          python 01_descargar.py
          python 02_limpiar_desfibriladores.py
          python 03_poblacion_secciones.py
          python 03b_puntos_de_poblacion.py
          python probar_catastro.py
      - uses: actions/upload-artifact@v4
        with:
          name: viviendas
          path: |
            datos/respaldo/viviendas_catastro.csv.gz
            datos/elaborados/puntos.csv
