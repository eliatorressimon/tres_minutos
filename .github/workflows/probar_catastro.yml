name: Probar Catastro
on:
  push:
    branches: [portales]
    paths: ['.github/workflows/probar_catastro.yml']
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - working-directory: src
        run: python viviendas_catastro.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datos/respaldo/viviendas_catastro.csv.gz
          git commit -m "Viviendas del Catastro"
          git pull --rebase -X theirs
          git push
